<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sweet Spot Card – Testseite</title>
<style>
  :root { --primary-color:#ff9800; --accent-color:#ff9800; --success-color:#43a047; --primary-text-color:#212121;
          --secondary-text-color:#727272; --divider-color:#e0e0e0; --card-background-color:#fff; --secondary-background-color:#f5f5f5; }
  body { font-family: Roboto, system-ui, sans-serif; background:#fafafa; margin:16px; max-width:560px; }
  ha-card { display:block; background:var(--card-background-color); border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  pre { font-size:12px; background:#eee; padding:8px; white-space:pre-wrap; }
</style></head>
<body>
<div id="host"></div>
<h2 style="font-size:16px;margin-top:24px">Editor</h2>
<div id="editor" style="background:#fff;padding:12px;border-radius:12px"></div>
<pre id="log"></pre>
<script type="module">
import "./fake-ha-form.js";
import "../sweet-spot-card.js";
const log = (m) => (document.getElementById("log").textContent = m + "\n" + document.getElementById("log").textContent);
const GROUP = ["media_player.front_left", "media_player.front_right", "media_player.rear_right", "media_player.kitchen"];
const mp = (v) => ({ state: "playing", last_changed: "2026-01-01T00:00:00Z", attributes: { volume_level: v, supported_features: 524288, group_members: GROUP } });
const states = {
  "media_player.front_left": mp(0.06),
  "media_player.front_right": mp(0.06),
  "media_player.rear_right": mp(0.06),
  "media_player.kitchen": mp(0.06),
  "input_select.listening_place": { state: "Sofa", attributes: { options: ["Armchair", "Sofa", "Dining table", "Kitchen"] } },
  "input_text.sweet_spot_memory": { state: "{}", attributes: {} },
};
const card = document.createElement("sweet-spot-card");
const hass = {
  states, locale: { language: "de" },
  callService(domain, service, data) {
    log(`${domain}.${service} ${JSON.stringify(data)}`);
    const e = data.entity_id;
    if (domain === "input_select") states[e] = { ...states[e], state: data.option };
    if (domain === "input_text") states[e] = { ...states[e], state: data.value };
    if (domain === "input_number") states[e] = { ...states[e], state: String(data.value) };
    if (domain === "media_player") states[e] = { ...states[e], attributes: { ...states[e].attributes, volume_level: data.volume_level } };
    card.hass = { ...hass, states: { ...states } };
    return Promise.resolve();
  },
};
card.setConfig(await (await fetch("config.json")).json());
card.hass = hass;
document.getElementById("host").appendChild(card);
window.card = card;
const editor = document.createElement("sweet-spot-card-editor");
editor.hass = hass;
editor.setConfig(await (await fetch("config.json")).json());
editor.addEventListener("config-changed", (e) => {
  log("config-changed " + JSON.stringify(e.detail.config.room));
  try { card.setConfig(e.detail.config); card.hass = { ...hass, states: { ...states } }; } catch (err) { log("card: " + err.message); }
  editor.setConfig(e.detail.config);
});
document.getElementById("editor").appendChild(editor);
window.editor = editor;
</script></body></html>
